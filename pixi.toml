[workspace]
authors = ["Giordon Stark <kratsg@gmail.com>"]
name = "stare"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]
exclude-newer = "7d"

[dependencies]
stare = { path = "./" }

[package]
name = "stare"
version = "latest"

[package.build]
backend = { name = "pixi-build-python", version = "*" }
config = { noarch = true }

[package.host-dependencies]
uv = "*"
hatchling = ">=1.25"
hatch-vcs = ">=0.4"

[package.run-dependencies]
python = ">=3.10"
httpx = ">=0.27"
hishel = ">=0.1"
keyring = ">=25"
pyjwt = ">=2.8"
cryptography = "*"
filelock = ">=3.13"
pydantic = ">=2"
pydantic-settings = ">=2"
typer = ">=0.12"
rich = ">=13"
platformdirs = ">=4"
lark = ">=1.2"

[feature.staging.activation.env]
STARE_BASE_URL = "https://glance-staging01.cern.ch/atlas/analysis/api"
STARE_CA_BUNDLE = "CERN"
STARE_EXCHANGE_AUDIENCE = "atlas-glance-analysis-api-dev"

[feature.py310.dependencies]
python = "<3.11,>=3.10"
tomli = ">=2"

[feature.py311.dependencies]
python = "<3.12,>=3.11"

[feature.py312.dependencies]
python = "<3.13,>=3.12"

[feature.py313.dependencies]
python = "<3.14,>=3.13"

[feature.py314.dependencies]
python = "<3.15,>=3.14"

[feature.test.dependencies]
pytest = ">=9"
pytest-cov = ">=3"
respx = ">=0.21"

[feature.test.tasks]
# Rich's Console checks these at construction time (module import), before any
# test-level env patching can take effect, so they must be set here rather
# than in conftest. TTY_COMPATIBLE=0 is Rich's own escape hatch for "this
# device cannot render escape codes" and is checked ahead of both FORCE_COLOR
# and isatty() auto-detection. FORCE_COLOR="" alone is not reliable here: on
# Windows, setting an env var to the empty string removes it from the
# environment rather than keeping it defined-but-empty, so Rich falls through
# to isatty() — which GitHub Actions' Windows runners can misreport as True
# for captured/redirected output, re-enabling ANSI codes that split
# substrings in test assertions (e.g. "0.4.3" -> "\x1b[1m0.4\x1b[0m.3").
# This is set as task env (not activation env): activation env applies to the
# whole environment, and since the default environment includes the test
# feature, an activation-scoped TTY_COMPATIBLE=0 would leak into every
# `pixi run stare ...` invocation, disabling Rich's colors and OSC-8
# hyperlinks on real terminals. Task-scoped env only applies while the task
# itself runs.
test = { cmd = "pytest -m 'not slow'", description = "Run quick tests (skip slow)", env = { TTY_COMPATIBLE = "0" } }
test-cov = { cmd = "pytest -m 'not slow' --cov=stare --cov-report=term --cov-report=html", description = "Run quick tests with coverage", env = { TTY_COMPATIBLE = "0" } }
test-slow = { cmd = "pytest --runslow", description = "Run tests including slow tests", env = { TTY_COMPATIBLE = "0" } }
test-all = { cmd = "pytest --cov=stare", description = "Run all tests with coverage", env = { TTY_COMPATIBLE = "0" } }

[feature.docs.dependencies]
zensical = "*"
lychee = "*"
pydocstyle = "*"
mkdocstrings = ">=0.26"
mkdocstrings-python = ">=1.12"

[feature.docs.tasks]
docs-build = { cmd = "zensical build", description = "Build documentation (static)", inputs = ["src/", "docs/", "zensical.toml"], outputs = ["site"] }
docs-linkcheck = { cmd = "lychee docs/", description = "Check documentation for broken links" }
docs-serve = { cmd = "zensical serve", depends-on = ["docs-build"], description = "Build and serve documentation" }
docs-clean = { cmd = "rm -rf site", description = "Clean documentation build artifacts", inputs = ["site"] }
check-docstrings = { cmd = "pydocstyle src/stare/", description = "Check docstring style" }

[feature.dev.dependencies]
python = ">=3.11"
pyyaml = ">=6"
tomli-w = ">=1.0"
pre-commit = "*"
identify = ">=1.4.20"  # ruff-check
pylint = ">=3.2"
tbump = ">=6.7.0"
mypy = "*"
ruff = "*"
python-build = "*"
twine = "*"
hishel = ">=0.1"
[feature.dev.tasks]
pre-commit = { cmd = "pre-commit run --all-files", description = "Run pre-commit hooks on all files" }
pylint = { cmd = "pylint stare", description = "Run PyLint on stare package" }
pre-commit-install = { cmd = "pre-commit install", description = "Install pre-commit git hooks" }
pre-commit-update = { cmd = "pre-commit autoupdate", description = "Update pre-commit hook versions" }
build-clean = { cmd = "rm -rf build dist", description = "Clean build artifacts" }
build = { cmd = "python -m build", depends-on = ["build-clean"], description = "Build SDist and wheel distributions", outputs = ["dist"] }
build-check = { cmd = "twine check --strict ./dist/*", depends-on = ["build"], description = "Run twine to check" }
extract-fields = { cmd = "python scripts/extract_dsl_fields.py", description = "Regenerate DSL field catalogues from api.yml" }
extract-enums = { cmd = "python scripts/extract_enums.py", description = "Regenerate enum fields from statuses.md" }

[environments]
default = ["test"]
docs = ["docs"]
dev = ["dev"]
py310 = ["test", "py310"]
py311 = ["test", "py311"]
py312 = ["test", "py312"]
py313 = ["test", "py313"]
py314 = ["test", "py314"]
staging = ["default", "staging"]

[tasks]
lint = { depends-on = ["pre-commit", "pylint"], description = "Run all linting (pre-commit + pylint)" }
check = { depends-on = ["lint", "test"], description = "Quick check: lint + basic tests" }
check-all = { depends-on = ["lint", "test-all"], description = "Comprehensive check: lint + all tests" }
