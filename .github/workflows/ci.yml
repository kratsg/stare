name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.68.1
          cache: true
          cache-key: dev
          cache-write:
            ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: dev

      - name: Run pre-commit
        run: pixi run pre-commit --hook-stage manual

      - name: Run PyLint
        run: pixi run pylint --output-format=github

  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.68.1
          cache: true
          cache-key: dev-${{ github.ref_name }}
          cache-write:
            ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: dev

      - name: Build and check package
        run: pixi run build-check

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [pre-commit]
    permissions:
      contents: read # checkout the repository
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        runs-on: [ubuntu-latest, macos-14]
        include:
          - python-version: "3.10"
            pixi-environment: py310
          - python-version: "3.11"
            pixi-environment: py311
          - python-version: "3.12"
            pixi-environment: py312
          - python-version: "3.13"
            pixi-environment: py313
          - python-version: "3.14"
            pixi-environment: py314

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.68.1
          cache: true
          cache-key: ${{ matrix.pixi-environment }}-${{ github.ref_name }}
          cache-write:
            ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: ${{ matrix.pixi-environment }}

      - name: Test package
        run: >-
          pixi run -e "$PIXI_ENVIRONMENT" test-all -ra --cov-branch
          --cov-report=xml --cov-report=term --junitxml=junit.xml -o
          junit_family=legacy --durations=20
        env:
          PIXI_ENVIRONMENT: ${{ matrix.pixi-environment }}

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  checks-windows:
    name: Check Python 3.14 on windows-latest
    runs-on: windows-latest
    needs: [pre-commit]
    permissions:
      contents: read # checkout the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.68.1
          cache: true
          cache-key: py314-windows-${{ github.ref_name }}
          cache-write:
            ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: py314

      - name: Test package
        run: >-
          pixi run -e py314 test-all -ra --cov-branch --cov-report=xml
          --cov-report=term --junitxml=junit.xml -o junit_family=legacy
          --durations=20

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
